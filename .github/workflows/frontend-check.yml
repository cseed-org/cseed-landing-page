# Cloudflare Workers Builds deploys the site. CI checks types and rendered SEO.
name: Check frontend

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'LICENSE'
      - 'CONTENT-NOTICE.md'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.mjs'
      - 'tsconfig.json'
      - '.github/workflows/frontend-check.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check rendered SEO without production member credentials
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/cseed-seo.log 2>&1 &
          site_pid=$!
          trap 'kill "$site_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4321/sitemap.xml > /dev/null; then
              break
            fi
            sleep 1
          done
          npm run check:seo -- http://127.0.0.1:4321
